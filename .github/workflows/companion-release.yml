name: Companion release

# Builds self-contained Federation Companion binaries for Windows, macOS, and
# Linux, and publishes them to a single rolling "companion-latest" GitHub
# release. Kept separate from the plugin's own per-version releases (tagged
# with plain version numbers like "0.0.102") so publishing a new plugin
# version never touches, and is never confused with, these binaries -
# Companion/install.sh and install.ps1 always point at this fixed tag.
on:
  push:
    paths:
      - "Companion/**"
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows ships the desktop/tray build (WinForms); the other
          # platforms keep the console/server build.
          - rid: win-x64
            tfm: net9.0-windows
          - rid: linux-x64
            tfm: net9.0
          - rid: osx-x64
            tfm: net9.0
          - rid: osx-arm64
            tfm: net9.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish Companion/FederationCompanion.csproj \
            -c Release -f ${{ matrix.tfm }} -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist/${{ matrix.rid }}
          rm -f dist/${{ matrix.rid }}/*.pdb
          python3 scripts/bundle_rclone.py ${{ matrix.rid }} dist/${{ matrix.rid }}

      - name: Zip
        run: |
          cd dist/${{ matrix.rid }}
          zip -r ../../FederationCompanion-${{ matrix.rid }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: FederationCompanion-${{ matrix.rid }}
          path: FederationCompanion-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd artifacts && sha256sum *.zip > SHA256SUMS)
          gh release delete companion-latest --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create companion-latest artifacts/*.zip artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Federation Companion (latest)" \
            --notes "Automated build from ${GITHUB_SHA::7}. Unsigned Windows build: SmartScreen may warn. Do not disable antivirus protection. Runs a local dashboard, stores private credentials, and offers an optional read-only rclone media mount (WinFsp needs UAC on Windows; Linux needs FUSE). Startup and remote sharing are opt-in. Verify SHA256SUMS; see Companion/README.md for permissions, installation and removal." \
            --latest=false
