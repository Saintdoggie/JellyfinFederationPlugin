<div id="federationAddInPage" class="page type-interior">
    <p id="federationAddInStatus" class="fed-muted">Loading add-in settings…</p>
</div>
<script type="text/javascript">
(function () {
    'use strict';
    var root = document.getElementById('federationAddInPage');
    var status = document.getElementById('federationAddInStatus');
    if (!root || !status) { return; }
    var params = new URLSearchParams(window.location.search);
    var hashQuery = window.location.hash.indexOf('?');
    var pageName = params.get('name');
    if (!pageName && hashQuery >= 0) {
        pageName = new URLSearchParams(window.location.hash.substring(hashQuery + 1)).get('name');
    }
    if (!pageName) {
        status.textContent = 'This add-in page could not be identified.';
        return;
    }
    var apiBase = window.location.origin;
    try {
        if (window.ApiClient && typeof window.ApiClient.serverAddress === 'function') {
            apiBase = window.ApiClient.serverAddress().replace(/\/+$/, '');
        } else {
            var webAt = window.location.pathname.toLowerCase().indexOf('/web');
            if (webAt >= 0) { apiBase += window.location.pathname.substring(0, webAt); }
        }
    } catch (e) { }
    var token = null;
    try {
        token = window.ApiClient && typeof window.ApiClient.accessToken === 'function' ? window.ApiClient.accessToken() : null;
    } catch (e) { }
    fetch(apiBase + '/Plugins/Federation/AddInPages/' + encodeURIComponent(pageName), {
        headers: token ? { 'Authorization': 'MediaBrowser Token="' + encodeURIComponent(token) + '"' } : {}
    }).then(function (response) {
        if (!response.ok) { throw new Error('The add-in page could not be loaded (HTTP ' + response.status + ').'); }
        return response.text();
    }).then(function (markup) {
        root.innerHTML = markup;
        Array.prototype.forEach.call(root.querySelectorAll('script'), function (oldScript) {
            var script = document.createElement('script');
            Array.prototype.forEach.call(oldScript.attributes, function (attribute) {
                script.setAttribute(attribute.name, attribute.value);
            });
            script.text = oldScript.text;
            oldScript.parentNode.replaceChild(script, oldScript);
        });
    }).catch(function (error) {
        root.textContent = '';
        root.appendChild(status);
        status.textContent = error.message;
    });
}());
</script>
